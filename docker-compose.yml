# Atlas on one server: web (Caddy + React) -> api (FastAPI) -> redis.
# Secrets come from a .env file next to this one (copy .env.example). It is
# never baked into an image and never committed.
#
#   docker compose up -d --build
services:
  api:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # The server does not run the laptop fallback. If Redis misses the
      # startup ping, the API exits. /api/ready keeps checking it after that.
      REDIS_REQUIRED: "true"
      APP_PUBLIC_URL: https://102-203-81-249.sslip.io
      # The browser only talks to the web container, which serves the React app
      # and the API from one address. That is same-origin, so no other website
      # is allowed to call the API from a browser. Empty = no cross-origin at all.
      CORS_ORIGINS: ""
    volumes:
      - atlas-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # No published ports: only the web container can reach the API.

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        # Dockerfile HEALTHCHECK hits /api/ready (Redis + database), not /api/live.
        condition: service_healthy
    restart: unless-stopped

volumes:
  atlas-data:
  redis-data:
  caddy-data:
  caddy-config:

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    # Builds both images and starts the whole stack (web -> api -> redis) on a
    # real Linux runner, then pokes it through the front door. This is how the
    # Docker files are tested: Docker is not installed on the dev machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write a throwaway .env (no OpenAI key needed to start)
        run: |
          echo "ATLAS_AUTH_SECRET=$(openssl rand -hex 32)" > .env

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Health check through the web proxy
        run: curl -fsS http://localhost/api/health

      - name: React app is served
        run: curl -fsS http://localhost/ | grep -q 'id="root"'

      - name: Security headers are sent on the app and on the API
        run: |
          for url in http://localhost/ http://localhost/api/health; do
            headers=$(curl -fsS -D - -o /dev/null "$url" | tr -d '\r')
            for name in strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy content-security-policy; do
              echo "$headers" | grep -qi "^$name:" || { echo "missing $name on $url"; exit 1; }
            done
          done

      - name: Unknown page falls back to the React app
        run: curl -fsS http://localhost/some/client/route | grep -q 'id="root"'

      - name: Demo login and an authenticated call (proxy, api, redis, database)
        run: |
          token=$(curl -fsS -X POST http://localhost/api/auth/demo | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl -fsS -H "Authorization: Bearer $token" http://localhost/api/threads

      - name: Backup, upload and restore round trip
        # The "bucket" here is a local folder (rclone's :local: backend), so no
        # account or keys are needed. Everything else is the real code path.
        run: |
          mkdir -p /tmp/offsite
          echo "BACKUP_REMOTE=:local:/offsite" > /tmp/backup.env
          BACKUP_DIR=/tmp/backups BACKUP_ENV_FILE=/tmp/backup.env \
            RCLONE_DOCKER_ARGS="-v /tmp/offsite:/offsite" deploy/backup.sh
          archive=$(ls /tmp/offsite/atlas-data-*.tar.gz | head -n 1)
          deploy/restore.sh "$archive" --into ci_restore_check
          docker compose run --rm --no-deps -T -v ci_restore_check:/app/data api python - <<'PY'
          import sqlite3
          db = sqlite3.connect("/app/data/atlas.db")
          assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          users = db.execute("SELECT COUNT(*) FROM users").fetchone()[0]
          assert users >= 1, users
          print("restored database is intact, users:", users)
          PY
          curl -fsS http://localhost/api/health

      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
